services:
  - type: web
    name: neuro-music
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: neuro-music-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://neuro-music.onrender.com"

databases:
  - name: neuro-music-db
    plan: free
