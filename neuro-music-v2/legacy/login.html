<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neuro Music — Sign In</title>
  <meta name="description" content="Sign in to Neuro Music" />
  <meta name="theme-color" content="#07070c" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icons/favicon.ico" sizes="32x32" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- Lucide Icons (self-hosted) -->
  <script src="lucide.js"></script>
</head>
<body>
  <!-- Ambient Dynamic Glow Backdrop -->
  <div class="backdrop"></div>

  <main class="auth-page" role="main">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">
          <i data-lucide="disc-3"></i>
        </div>
        <h1>Neuro Music</h1>
      </div>

      <!-- Tab Navigation -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" role="tab" aria-selected="true" id="tab-login" data-tab="login">
          <i data-lucide="log-in"></i>
          <span>Sign In</span>
        </button>
        <button class="auth-tab" role="tab" aria-selected="false" id="tab-register" data-tab="register">
          <i data-lucide="user-plus"></i>
          <span>Register</span>
        </button>
      </div>

      <!-- Error/Success Message -->
      <div class="auth-message" id="authMessage" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form class="auth-form active" id="form-login" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              aria-describedby="login-email-error"
            />
          </div>
          <p class="form-error" id="login-email-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-describedby="login-password-error"
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="login-password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <p class="form-error" id="login-password-error" aria-live="polite"></p>
        </div>

        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="remember-me" name="remember" />
            <span class="checkmark"></span>
            <span>Remember me</span>
          </label>
          <a href="#forgot" class="forgot-link" id="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary auth-submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" aria-hidden="true">
            <i data-lucide="loader"></i>
          </span>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="form-register" novalidate>
        <div class="form-group">
          <label for="register-name">Display Name</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input
              type="text"
              id="register-name"
              name="display_name"
              class="form-input"
              placeholder="Your name"
              autocomplete="name"
              required
              minlength="1"
              maxlength="40"
              aria-describedby="register-name-error"
            />
          </div>
          <p class="form-error" id="register-name-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input
              type="email"
              id="register-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              aria-describedby="register-email-error"
            />
          </div>
          <p class="form-error" id="register-email-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input
              type="password"
              id="register-password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              minlength="8"
              aria-describedby="register-password-error register-password-hint"
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="register-password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <p class="form-error" id="register-password-error" aria-live="polite"></p>
          <p class="form-hint" id="register-password-hint">At least 8 characters with a letter and number</p>
        </div>

        <div class="form-group">
          <label for="register-confirm">Confirm Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input
              type="password"
              id="register-confirm"
              name="confirm_password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              aria-describedby="register-confirm-error"
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="register-confirm">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <p class="form-error" id="register-confirm-error" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn-primary auth-submit">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" aria-hidden="true">
            <i data-lucide="loader"></i>
          </span>
        </button>
      </form>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="form-forgot" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input
              type="email"
              id="forgot-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              aria-describedby="forgot-email-error"
            />
          </div>
          <p class="form-error" id="forgot-email-error" aria-live="polite"></p>
        </div>

        <p class="form-hint">We'll send a reset link to your email if an account exists.</p>

        <button type="submit" class="btn-primary auth-submit">
          <span class="btn-text">Send Reset Link</span>
          <span class="btn-loader" aria-hidden="true">
            <i data-lucide="loader"></i>
          </span>
        </button>

        <p class="back-to-login"><a href="#login" id="back-to-login">← Back to Sign In</a></p>
      </form>

      <div class="auth-footer">
        <p>By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
