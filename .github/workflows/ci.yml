name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          working-directory: ./neuro-music-app/backend
          args: "check . --output-format=github"

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neuro_music_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: neuro-music-app/backend/requirements.txt

      - name: Install dependencies
        working-directory: ./neuro-music-app/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/neuro_music_test" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-for-ci-at-least-32-chars-long" >> $GITHUB_ENV
          echo "ENV=test" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "YT_API_KEY=" >> $GITHUB_ENV

      - name: Run migrations
        working-directory: ./neuro-music-app/backend
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: ./neuro-music-app/backend
        run: |
          python -m pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./neuro-music-app/backend/coverage.xml
          flags: backend

  backend-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: neuro-music-app/backend/requirements.txt

      - name: Install dependencies
        working-directory: ./neuro-music-app/backend
        run: pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        working-directory: ./neuro-music-app/backend
        run: pip-audit -r requirements.txt --desc --format=json --output=audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: neuro-music-app/backend/audit.json

  frontend-lint:
    name: Frontend Lint (ruff for Python, eslint for JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: neuro-music-app/frontend/package.json

      - name: Install dependencies
        working-directory: ./neuro-music-app/frontend
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Run ESLint
        working-directory: ./neuro-music-app/frontend
        run: |
          if [ -f package.json ] && [ -f .eslintrc.json ]; then npx eslint . --ext .js; fi

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neuro_music_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: neuro-music-app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: neuro-music-app/frontend/package.json

      - name: Install backend dependencies
        working-directory: ./neuro-music-app/backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./neuro-music-app/frontend
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install Playwright
        working-directory: ./neuro-music-app/frontend
        run: npx playwright install --with-deps chromium

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/neuro_music_test" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-for-ci-at-least-32-chars-long" >> $GITHUB_ENV
          echo "ENV=test" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000" >> $GITHUB_ENV
          echo "YT_API_KEY=" >> $GITHUB_ENV

      - name: Run backend migrations
        working-directory: ./neuro-music-app/backend
        run: alembic upgrade head

      - name: Start backend server
        working-directory: ./neuro-music-app
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/api/health

      - name: Start frontend preview server
        working-directory: ./neuro-music-app/frontend
        run: |
          npx serve -l 3000 &
          sleep 3
          curl -f http://localhost:3000

      - name: Run Playwright tests
        working-directory: ./neuro-music-app/frontend
        run: npx playwright test --reporter=github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: neuro-music-app/frontend/playwright-report/

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, playwright-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./neuro-music-app/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/neuro-music-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./neuro-music-app/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/neuro-music-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}